version: "3.8"

services:
  app:
    build: .
    container_name: quickbite-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/quickbite
      - APP_KEY=super_secret_jwt_key_quickbite_production_32chars_min
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=*
      - RATE_LIMIT_MAX=100
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:6.0
    container_name: quickbite-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
    driver: local
