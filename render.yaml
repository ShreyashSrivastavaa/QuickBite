services:
  - type: web
    name: quickbite-fullstack
    env: node
    plan: free
    buildCommand: "npm install && npm run seed && cd frontend && npm install --include=dev && npm run build && cd .."
    startCommand: "node app.js"
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: PORT
        value: "8000"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: APP_KEY
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
